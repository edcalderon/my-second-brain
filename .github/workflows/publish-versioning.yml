name: Publish Versioning to NPM

on:
  push:
    tags:
      - 'versioning-v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Install dependencies
        run: pnpm install

      - name: Build versioning package
        run: pnpm --filter @edcalderon/versioning build

      - name: Run tests
        run: pnpm --filter @edcalderon/versioning test

      - name: Generate build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: packages/versioning/package.json

      - name: Extract version from tag
        id: extract_version
        run: |
          TAG_NAME="${{ github.ref_name }}"
          if ! [[ "$TAG_NAME" =~ ^versioning-v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid versioning release tag: $TAG_NAME"
            exit 1
          fi
          VERSION=${TAG_NAME#versioning-v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Publishing version: $VERSION"

      - name: Verify release metadata
        run: |
          VERSION=${{ steps.extract_version.outputs.version }}
          cd packages/versioning
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          if [ "$CURRENT_VERSION" != "$VERSION" ]; then
            echo "package.json version $CURRENT_VERSION does not match tag version $VERSION"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release tag must reference a commit already merged into main"
            exit 1
          fi
          npm run update-readme
          git diff --exit-code -- README.md
          npm run verify:release

      - name: Check npm registry
        id: npm_registry
        run: |
          VERSION=${{ steps.extract_version.outputs.version }}
          if npm view "@edcalderon/versioning@$VERSION" version > /dev/null 2>&1; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "@edcalderon/versioning@$VERSION is already published; skipping npm publish."
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to NPM
        if: steps.npm_registry.outputs.already_published != 'true'
        run: cd packages/versioning && npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSIONING_ACTION_PUBLISH: 'true'

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        continue-on-error: true
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            ## Changes

            This release was automatically published from the versioning package.

            ### Installation

            ```bash
            npm install @edcalderon/versioning
            # or
            pnpm add @edcalderon/versioning
            # or
            yarn add @edcalderon/versioning
            ```

            ### Usage

            ```bash
            npx @edcalderon/versioning --help
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
