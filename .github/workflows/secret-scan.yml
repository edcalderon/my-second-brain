name: Secret scan

# Server-side backstop: hooks can be skipped (--no-verify, fresh clones), this cannot.
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan changes in this push / PR
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="origin/${{ github.base_ref }}...HEAD"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            range="${{ github.event.before }}..${{ github.sha }}"
          else
            range="HEAD~1..HEAD"
          fi
          ./scripts/secret-scan.sh --range "$range"
      - name: Scan the whole tracked tree
        run: ./scripts/secret-scan.sh --tree
